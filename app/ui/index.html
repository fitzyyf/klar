<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent会话Review</title>
  <script>if (/^Mac/.test(navigator.platform)) document.documentElement.classList.add("mac");</script>
  <link rel="stylesheet" href="nebula.css">
</head>
<body class="window">
  <header class="top">
    <div class="drag" aria-hidden="true"></div>
    <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 18 18" width="16" height="16"><circle cx="4.2" cy="9" r="2.1" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="13.8" cy="9" r="2.1" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6.3 9h5.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span><span>Agent会话Review</span></div>
    <p class="base" id="session-line"></p>
    <div class="actions">
      <button type="button" id="switch-project" class="text">切换项目</button>
      <button type="button" id="refresh" class="text">刷新</button>
    </div>
  </header>

  <p id="banner" class="banner" hidden></p>

  <section class="stage" aria-label="Agent会话Review">
    <aside id="pane-sessions" class="pane sessions-col" aria-label="agent 会话">
      <div class="side-tools">
        <p id="project-path" class="project-path"></p>
        <p class="side-label">近期会话</p>
      </div>
      <div id="sessions" class="list"></div>
    </aside>
    <div class="gutter" data-side="left" role="separator" aria-orientation="vertical" aria-label="拖左边"></div>

    <div id="pane-sky" class="pane sky" data-workspace="chain" aria-label="调用链 UML 图">
      <div class="sky-bar">
        <div class="session-head">
          <h2 id="session-title"></h2>
          <p id="session-review"></p>
        </div>
        <div id="workspace" class="workspace" role="tablist">
          <button type="button" data-workspace="chain" aria-current="true">调用链</button>
          <button type="button" data-workspace="talk">对话流</button>
        </div>
      </div>
      <nav id="turn-bar" class="turn-bar" aria-label="回合"></nav>
      <div id="talk" class="talk"></div>
      <div id="chart" role="img" aria-label="调用链 UML 图"></div>
      <p id="sky-empty" class="sky-empty" hidden></p>
      <div class="legend" aria-hidden="true">
        <span><i class="swatch add"></i>加上的调用、新方法</span>
        <span><i class="swatch cut"></i>拆掉的调用</span>
        <span><i class="swatch edit"></i>方法改了、参数改了</span>
        <span><i class="swatch unsure"></i>指向不确定</span>
        <span>菱形是判定。方框写「循环」的是 for / while。箭头上的 [条件] 是分支</span>
        <span>⌘/Ctrl 加滚轮缩放</span>
      </div>
    </div>
    <div class="gutter" data-side="right" role="separator" aria-orientation="vertical" aria-label="拖右边"></div>

    <aside id="pane-detail" class="pane detail" aria-label="调用点或方法">
      <div class="detail-scroll">
        <dl class="intent">
          <dt id="said-label">你说的</dt><dd id="said"></dd>
          <dt id="reply-label">它说的</dt><dd id="reply"></dd>
          <dt>实际</dt><dd id="caption"></dd>
        </dl>
        <div class="chain-wrap">
          <p class="col-name">全链</p>
          <div id="chains"></div>
        </div>
        <div id="edits" class="edits"></div>
        <div id="detail"></div>
      </div>
      <div class="pass">
        <p id="pass-scope" class="scope"></p>
        <button type="button" id="pass" class="primary">记下通过</button>
        <textarea id="back-text" rows="2" placeholder="写下退回意见"></textarea>
        <button type="button" id="back" class="back">记下退回</button>
        <p id="pass-note"></p>
        <div id="handoff" class="handoff" hidden>
          <label class="col-name" for="handoff-text">粘给这个会话的 agent</label>
          <textarea id="handoff-text" rows="4" readonly></textarea>
          <button type="button" id="handoff-copy" class="text">复制</button>
        </div>
      </div>
    </aside>
  </section>

  <div id="guide" class="modal" hidden>
    <div class="dialog" role="dialog" aria-labelledby="guide-title">
      <p class="label">向导</p>
      <h2 id="guide-title">选一个项目</h2>
      <p class="dialog-note">左边列出这个项目里近期的会话。点开一条，再复原改过的文件并组装调用链。</p>
      <div id="guide-list"></div>
      <div class="dialog-bar"><button type="button" id="guide-close" class="text">先不换</button></div>
    </div>
  </div>

  <script src="vendor/elk.bundled.js"></script>
  <script src="chain.js"></script>
  <script src="split.js"></script>
  <script src="vendor/editor.js"></script>
  <script src="detail.js"></script>
  <script src="guide.js"></script>
  <script src="talk.js"></script>
  <script src="nebula.js"></script>
</body>
</html>
